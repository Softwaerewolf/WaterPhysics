name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. force-pushes, rapid commits).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # The gradle-wrapper.jar is not committed (blocked by the repo's *.jar
      # ignore rule), so install Gradle directly — version pinned to match
      # gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Build plugin
        run: gradle build

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: WaterPhysics
          path: build/libs/*.jar
          if-no-files-found: error
