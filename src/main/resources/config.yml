# ============================================================
#   WaterPhysics Configuration
#   All values are cached as primitives at startup.
#   Changes require /wp reload (or server restart).
# ============================================================

# Enable water physics on server start
enabled: true

# Worlds where water physics is active (whitelist).
# Use ["*"] (or leave empty) to enable in ALL worlds.
# Otherwise list world names: ["world", "world_nether"].
# In worlds NOT listed, water behaves 100% vanilla (plugin does not touch it).
worlds:
  - "castlewars"

# ---- Flow Settings ----------------------------------------
flow:
  # Water level equalization: a fuller block (lower level number) gradually raises
  # its less-full water neighbours by 1 step per tick without consuming the fuller
  # block.  Sources (level 0) stay as sources.  Produces smooth, even water surfaces.
  # DISABLED BY DEFAULT — implementation needs review for water dupe bug.
  equalize-water-levels: true

  # interaction-only mode: water physics triggers ONLY when a player
  # places or breaks a block adjacent to water.
  # Like sand/gravel physics — disturb a block to start the chain reaction.
  # Prevents CPU waste on static water (oceans, ponds, rivers).
  # Disable if you need water to flow in unloaded areas or via commands/datapacks.
  interaction-only: true

  # Max blocks processed per tick.
  # Higher = more responsive water, but more CPU per tick.
  # Recommended: 256-1024. Tweak if you notice lag or slow water.
  batch-size: 512

  # Ticks between each processing run (1 = every tick).
  tick-interval: 3

  # Evaporate stranded thin films: a small flowing block left with nowhere to
  # flow (no fuller neighbour, no drop, no reachable drain) is removed instead
  # of hanging forever as a tiny puddle.
  remove-puddles: false

  # Max water "units" a film may have to still count as a removable puddle.
  # 1 = only the thinnest layer (level 7).  Higher = removes deeper leftovers.
  # Range 1-7.
  puddle-max-units: 1

# ---- Evaporation ------------------------------------------
# A random-tick pass (mirroring vanilla's randomTickSpeed) samples blocks in
# the 3x3 loaded chunks around each online player every tick. A sampled
# shallow water block at the edge of a body has a chance to lose one unit, so
# puddles slowly dry up while the interior of a body (fully surrounded by
# water) and ocean sources are left alone. Water only — lava never
# evaporates. Off by default.
evaporation:
  # Enable evaporation.
  enabled: false

  # Only water blocks holding this many units OR FEWER are eligible to
  # evaporate. 8 = full source, 1 = thinnest film. Clamped to 1-8.
  minimum-units: 1

  # A block evaporates only if it has FEWER than this many water neighbours
  # on the X/Z (horizontal) axis. 1 = only fully isolated blocks (0 water
  # neighbours); 4 = any block not fully surrounded by water. Clamped to 1-4.
  minimum-neighbors: 2

  # Probability (0.0 - 1.0) that an eligible block loses one unit on a given
  # check. Clamped to 0.0-1.0. 0 = never, 1 = every check.
  chance: 0.05

# ---- Optimization -----------------------------------------
optimization:
  # Only process water blocks in chunks near online players.
  # Disabling this processes water EVERYWHERE (expensive on large servers).
  player-proximity-check: true

  # Chunk radius around each player to process.
  # 4 = 9x9 chunk area (~144 chunks) per player.
  player-proximity-chunks: 4

  # How many seconds a cached block state stays valid without access.
  # Higher = fewer world reads, more RAM used.
  cache-ttl-seconds: 60

  # Maximum number of block states held in cache (per world).
  # LRU eviction when limit is hit. 100k ≈ 3-4 MB.
  cache-max-size: 100000

  # When a chunk loads (e.g. player flies back to a draining area),
  # scan it for flowing water and re-queue those blocks so the drain continues.
  # Has no effect when interaction-only is true.
  chunk-rescan-on-load: true

  # Max water blocks re-queued per chunk on load.
  # Prevents queue explosion if an ocean chunk loads with thousands of sources.
  chunk-scan-max-blocks: 2000

  # Biomes where FULL water blocks (sources, level 0) act as INFINITE sources
  # instead of being simulated: they never drain, and when disturbed they top
  # up adjacent air, plants, or partially filled water to full sources —
  # keeping water's usual interactions (washing away torches/plants,
  # waterlogging, solidifying lava). Digging into an ocean floods the hole;
  # the ocean itself never empties. Partially filled water in these biomes is
  # NOT infinite — it flows with the normal finite physics, and dissipates
  # when it would flow down into an infinite source.
  # Use lowercase biome keys (e.g. "ocean", "deep_ocean"). Empty list = all biomes finite.
  excluded-biomes:
    - ocean
    - deep_ocean
    - warm_ocean
    - lukewarm_ocean
    - cold_ocean
    - frozen_ocean
    - deep_cold_ocean
    - deep_frozen_ocean
    - deep_lukewarm_ocean
    - river
    - frozen_river

# ---- Waterlogged Blocks ------------------------------------
# Controls whether nearby blocks (stairs, slabs, fences, etc.) get waterlogged
# when water flows around them, and unwaterlogged when water recedes.
# This creates a realistic visual of rising/falling water levels.
waterlogged:
  # Enable waterlogging feature.
  enabled: true

  # Water at this level OR LOWER causes adjacent waterloggable blocks to become
  # waterlogged.  Water ABOVE this level causes them to be unwaterlogged.
  # Scale: 0 = source (full), 7 = barely flowing.
  # Default 3 = roughly "more than half full" triggers waterlogging.
  max-level: 3

# ---- Sea Plants -------------------------------------------
sea-plants:
  # Replace seagrass / kelp / bubble columns with water when water flows into them.
  remove-on-flow: true

  # Prevent seagrass and kelp from growing / spreading.
  prevent-growth: true

# ---- Bucket Mechanics -------------------------------------
bucket:
  # When a player places a water bucket near/into water, re-evaluate all water
  # blocks within scan-radius so the body tries to spread or overflow.
  # Note: true upward "rising" requires hydrostatic pressure (not implemented).
  # What this does: if the water body has any open edge, it will find and fill it.
  enabled: true

  # Horizontal scan radius around the placement point (blocks).
  # Larger = more water gets re-evaluated per bucket use (more spread, more CPU).
  scan-radius: 8

  # Finite bucket contents. When enabled, buckets track how many units of water
  # they hold (0-8) as item NBT:
  #   - An empty bucket used on water < 8 units fills a PARTIAL water bucket
  #     holding exactly those units.
  #   - A partial water bucket used on water (not sneaking) tops itself up from
  #     that water, taking only as much as it needs / the water has.
  #   - A partial water bucket used on water while SNEAKING deposits its units
  #     into the targeted block.
  #   - A partial water bucket used on air places exactly its units of water.
  # When disabled, buckets behave the vanilla way (always 8 units).
  partial-fill: true

  # When water placed from a bucket would push a target tile above 8 units,
  # spread the excess into the nearest air / flowing-water neighbours instead of
  # discarding it; any units that still don't fit are kept in the bucket.
  # When disabled, the target simply caps at 8 and the excess is lost.
  preserve-overflow: true

# ---- Bottle Mechanics -------------------------------------
bottle:
  # Finite-water accounting for glass bottles and water bottles. When enabled:
  #   - Filling a glass bottle from water (or flowing water) deducts `unit-value`
  #     units from that water.
  #   - Using a water bottle (a water potion) while SNEAKING places `unit-value`
  #     units of water on the targeted block, using the same placement/overflow
  #     logic as a partial water bucket.
  # When disabled, bottles behave the vanilla way.
  consume: false

  # How many water units one bottle is worth (clamped 1-8). Recommended: 3, so a
  # 3-level water cauldron is worth one full (8-unit-capped) bucket, matching
  # vanilla's "3 bottles = 1 cauldron" relationship.
  unit-value: 3

# ---- Cauldron Mechanics -----------------------------------
cauldron:
  # Treat each water-cauldron level as `bottle.unit-value` units when filling a
  # bottle or bucket from the cauldron: a bottle takes one level (= unit-value),
  # and a bucket takes all levels (levels x unit-value, capped at 8). Requires a
  # water cauldron; needs no other feature flag.
  use-bottle-units: false

# ---- Lava Interaction -------------------------------------
lava:
  # Convert flowing lava to cobblestone when touched by water.
  convert-to-cobblestone: true

  # Convert lava SOURCE blocks to obsidian when touched by water.
  convert-source-to-obsidian: true

  # Apply the same finite-flow physics to LAVA as to water.
  # false (default) = lava keeps 100% vanilla behaviour (never frozen).
  # true = lava flows/drains with the conserving model (experimental).
  # Note: lava flowing INTO water does not solidify (only water→lava reacts).
  apply-physics: false

# ---- Sounds -----------------------------------------------
sounds:
  # Play water sounds as water flows to new blocks.
  enabled: true

  # Minimum ticks between sounds in the same chunk.
  # Lower = more frequent (can feel noisy). Recommended: 8-20.
  rate-limit-ticks: 10

  # Volume (0.0 - 1.0).
  volume: 0.35

  # Pitch center (randomised ±0.2 each play for variation).
  pitch: 1.0

# ---- Visual Effects ---------------------------------------
effects:
  # Spawn water particles when water flows to a new block.
  # Only plays near players (within the proximity radius) — pointless off-screen.
  enabled: true

  # Minimum ticks between particle bursts in the same chunk (rate limit).
  # Lower = denser visuals, more packets. Recommended: 3-8.
  rate-limit-ticks: 4

  # Particles per burst.
  count: 6

  # Spawn falling_water particles along the drop whenever water snaps down
  # more than 1 block (the engine moves falling water to the bottom of a
  # column in a single step — this visualises the fall). Only plays near
  # players and shares the rate limit above.
  falling-water-enabled: true
